:root{--bg:#1d0f22;--panel:#2a1830;--panel2:#341d3b;--borde:rgba(246,181,46,.28);--txt:#fbf3ff;--txt2:#cdb8d6;--oro:#f6b52e;--mor:#8e3fbf;--ros:#e05a9c;--ok:#7bd88f;--err:#ff6b6b;

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

.chip{display:flex;align-items:center;gap:5px;white-space:nowrap;padding:4px 10px 4px 6px;border-radius:999px;background:rgba(20,8,26,.78);border:1.5px solid var(--borde);font:16px var(--t);letter-spacing:.02em;text-shadow:0 1px 2px #000;pointer-events:auto}

/* ventana emergente (tienda, mejoras, cocina…) */

#g-top{flex:0 0 25%;min-height:118px;display:flex;flex-direction:column;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 8px 0}

#g-tit{margin-left:auto;font:22px var(--t);color:#fff;text-shadow:0 2px 0 #2a4a12,0 0 8px rgba(0,0,0,.6)}

#g-alerta.roja{background:#b71c1c;border-color:#ffcdd2;animation:pLate .5s ease-in-out infinite}
#ch-ings{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}

@media (max-width:400px){#ch-ings{gap:3px}#ch-ings .ing{padding:1px 5px 1px 1px;gap:2px}#ch-ings .ing img{width:18px;height:18px}}
#ch-grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:0 10px;align-items:end;justify-items:center;padding:0 16px 4px}
#g-acc{flex:none;display:flex;gap:8px;justify-content:center;padding:6px 10px 2px}
#g-acc .b{min-height:44px;font-size:14px;border:2px solid #3a1d08}
#g-semillas{flex:none;display:flex;gap:6px;overflow-x:auto;padding:6px 8px 10px;scrollbar-width:none;background:linear-gradient(180deg,transparent,rgba(20,40,10,.55))}
#g-semillas::-webkit-scrollbar{display:none}
.sem{flex:none;width:82px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px 5px;border-radius:14px;border:2px solid #3a1d08;background:linear-gradient(180deg,#fff6d8,#e9c98a);color:#3a1d00;font:12px var(--t);box-shadow:0 3px 0 rgba(0,0,0,.35);cursor:pointer}

.parc{position:relative;width:100%;max-width:170px;aspect-ratio:260/134;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* preparar chicha */

.pr-pasos{display:flex;gap:6px;justify-content:center;margin-top:10px}.pr-pasos span{width:54px;padding:4px 0;border-radius:10px;background:rgba(0,0,0,.3);font:13px var(--t);color:var(--txt2)}

.card.gastado{border-color:rgba(255,107,107,.6);background:rgba(255,107,107,.08)}
#h-pase-c{cursor:pointer}

.tab.punto::after{content:'';position:absolute;top:8px;right:22%;width:9px;height:9px;border-radius:50%;background:var(--ros);box-shadow:0 0 8px var(--ros)}
