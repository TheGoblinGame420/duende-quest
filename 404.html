<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Pagina de las rutas que no existen (not_found_handling = "404-page" en wrangler.toml). -->
<meta name="robots" content="noindex">
<title>Duende Quest · Página no encontrada</title>
<meta name="theme-color" content="#070c0b">
<link rel="icon" href="/assets/ui/coin.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:#070c0b;color:#ecf7f1;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;}
main{max-width:420px;width:100%;}
img{width:72px;height:72px;margin-bottom:12px;}
h1{font-size:26px;line-height:1.2;margin-bottom:8px;}
p{color:#a9bdb3;margin-bottom:20px;}
.jugar{display:block;padding:16px;border-radius:14px;background:#ffd84a;color:#112721;font-size:18px;font-weight:800;text-decoration:none;}
.web{display:inline-block;margin-top:12px;padding:10px;color:#ecf7f1;}
a:focus-visible{outline:3px solid #fff;outline-offset:2px;}
</style>
<!-- tema:inicio (lo escribe tools/tema.mjs desde css/tema.css; no editar aqui) --><style id="dq-tema">:root{--primary:#22e39a;--primary-strong:#0a8457;--primary-deep:#086b47;--primary-soft:#6df5bd;--primary-ink:#03150d;--secondary:#a78bfa;--secondary-strong:#7c4dff;--accent:#f5c84c;--accent-strong:#c9962a;--accent-ink:#1b1305;--bg-deep:#040706;--bg-dark:#070c0b;--surface:#0d1614;--surface-2:#13201c;--surface-3:#1a2b26;--glass:rgba(8,16,14,.86);--glass-soft:rgba(10,22,19,.62);--border:#213832;--border-soft:rgba(109,245,189,.18);--border-gold:rgba(245,200,76,.38);--text:#ecf7f1;--text-2:#a9bdb3;--text-3:#7f958a;--success:#34d399;--warning:#fbbf24;--danger:#ff5d6c;--info:#7dd3fc;--grad-primary:linear-gradient(180deg,#6ff8c0 0%,#1ad68a 100%);--grad-accent:linear-gradient(180deg,#fbe08d 0%,#e8b03a 100%);--grad-brand:linear-gradient(120deg,#22e39a 0%,#f5c84c 100%);--glow-primary:0 0 0 1px rgba(34,227,154,.38),0 8px 24px rgba(16,185,129,.24);--glow-accent:0 0 0 1px rgba(245,200,76,.42),0 8px 24px rgba(245,200,76,.2);--shadow:0 10px 30px rgba(0,0,0,.5)}</style><!-- tema:fin -->
</head>
<body>
<main>
  <img src="/assets/ui/coin.png" alt="" width="72" height="72">
  <h1>Este camino no lleva a ningún lado</h1>
  <p>La página que buscas no existe o cambió de lugar.</p>
  <a class="jugar" href="/jugar/?web=1">Jugar gratis</a>
  <a class="web" href="/">Ir a la portada</a>
</main>
<script>
/* Un enlace de anuncio roto: el utm/fbclid sigue su camino, y con el el modo anuncio sin cripto. */
(function () {
  var q = location.search;
  if (!/[?&](fbclid|utm_[a-z]+|ad)=/i.test(q)) return;
  document.querySelector('.jugar').href = '/jugar/' + q;
  document.querySelector('.web').href = '/' + q;
})();
</script>
</body>
</html>
