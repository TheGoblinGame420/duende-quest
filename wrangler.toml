name = "duende-quest"
compatibility_date = "2024-01-01"
main = "worker.js"

# Crons: keep-alive Supabase (3:00/15:00), recordatorio diario (17:00 UTC), torneo semanal (lunes 12:00 UTC)
[triggers]
crons = ["0 3,15 * * *", "0 17 * * *", "0 12 * * 1", "0 0 * * *"]

[assets]
directory = "."
# Sin binding, env.ASSETS era undefined en worker.js y cualquier ruta que no
# fuera un archivo devolvia 500 (error 1101) en vez del fallback SPA.
binding = "ASSETS"
not_found_handling = "single-page-application"
# Sin esto, Cloudflare sirve los archivos estaticos (index.html, engine.js,
# tonconnect-manifest.json...) DIRECTO desde su cache, sin pasar por
# worker.js: las cabeceras de seguridad que se añaden ahi solo llegaban a
# aparecer en rutas que no existen (el unico caso que SI cae al Worker por
# defecto). Con run_worker_first, toda peticion pasa primero por worker.js.
run_worker_first = true
