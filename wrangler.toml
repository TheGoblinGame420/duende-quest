name = "duende-quest"
compatibility_date = "2024-01-01"
main = "worker.js"

# Crons: keep-alive Supabase (3:00/15:00), recordatorio diario (17:00 UTC), torneo semanal (lunes 12:00 UTC)
[triggers]
crons = ["0 3,15 * * *", "0 17 * * *", "0 12 * * 1", "0 0 * * *"]

[assets]
directory = "."
# Sin binding, env.ASSETS era undefined en worker.js y cualquier ruta que no
# fuera un archivo devolvia 500 (error 1101) en vez del fallback SPA.
binding = "ASSETS"
not_found_handling = "single-page-application"
# Solo las rutas dinamicas pasan primero por worker.js; los estaticos
# (index.html, mundo/js, mmo/js, assets...) se sirven directo, sin gastar una
# invocacion del Worker por archivo (antes 40-60 por visita, ahora 1-3). Sus
# cabeceras de seguridad (frame-ancestors de Telegram, HSTS, nosniff...) y de
# cache salen del archivo _headers. Rutas que maneja worker.js: /api/* (bot,
# facturas, helius, wallet, token-stats) y /mmo/ws (WebSocket del Durable
# Object). /interno/* NO va: solo existe dentro del Durable Object
# (stub.fetch) y nunca pasa por este enrutado. Si worker.js gana una ruta
# nueva, AGREGARLA aqui o la tapara el fallback SPA.
run_worker_first = ["/api/*", "/mmo/ws", "/mmo/ws/*"]

# DUENDE QUEST ONLINE (mmo/): el mundo en tiempo real es un Durable Object
# (functions/mmo/world.js) al que se conecta cada jugador por WebSocket en
# /mmo/ws. new_sqlite_classes y no new_classes: el plan gratuito de Workers
# solo admite Durable Objects con almacenamiento SQLite.
[[durable_objects.bindings]]
name = "MMO"
class_name = "MmoWorld"

[[migrations]]
tag = "v1-mmo"
new_sqlite_classes = ["MmoWorld"]
