<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0418">
<title>Sin conexión · Duende Quest</title>
<style>
  html,body{margin:0;height:100%;background:#0a0418;color:#ede9fe;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px;box-sizing:border-box;}
  img{width:96px;height:96px;image-rendering:pixelated;border-radius:20px;margin-bottom:16px;}
  h1{font-size:22px;margin:0 0 8px;color:#ffd84a;}
  p{margin:0 0 20px;max-width:340px;color:#c4b5fd;}
  button{font:600 16px system-ui,sans-serif;padding:12px 22px;border:0;border-radius:12px;background:linear-gradient(90deg,#7c3aed,#2563eb);color:#fff;cursor:pointer;}
</style>
</head>
<body>
<main>
  <img src="/assets/ui/icon-192.png" alt="">
  <h1>Sin conexión</h1>
  <p>El mundo de los duendes es online: necesitas internet para jugar. En cuanto vuelva la conexión, entra de nuevo.</p>
  <button onclick="location.reload()">Reintentar</button>
</main>
<script>addEventListener('online', () => location.reload());</script>
</body>
</html>
