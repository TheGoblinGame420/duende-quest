<title>Sin conexión · Duende Quest</title>
<style>
  html,body{margin:0;height:100%;background:#070c0b;color:#ede9fe;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}

<body>
<main>
  <img src="/assets/ui/icon-192.png" alt="">
  <h1>Sin conexión</h1>
  <p>Duende Quest es un juego en línea y necesita internet. Tu duende está guardado: en cuanto vuelva la señal te reconectamos solos.</p><p id="est" style="font-size:13px;color:#84b09a;margin-top:-10px">Buscando señal…</p>
  <button onclick="location.reload()">Reintentar</button>
</main>
<script>addEventListener('online', () => location.reload());var n=0;setInterval(function(){n++;document.getElementById('est').textContent='Buscando señal… (intento '+n+')';fetch('/sw.js?r='+Date.now(),{method:'HEAD',cache:'no-store'}).then(function(r){if(r.ok)location.reload();}).catch(function(){});},10000);</script>
